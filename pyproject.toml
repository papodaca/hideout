[project]
name = "hideout"
version = "0.1.0"
description = "Local RAG TUI over markdown libraries"
requires-python = ">=3.11"
dependencies = [
  "prompt_toolkit",
  "pymupdf",
  "rich",
  "zvec",
]

[project.scripts]
hideout = "hideout.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
