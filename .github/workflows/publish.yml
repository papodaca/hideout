# Trusted publishing via OIDC. The npm publisher is stage-only, so CI
# uploads a draft and you approve it (2FA) on npmjs.com or:
#   npm stage approve @papodaca/hideout@<version>
#
# To publish live from CI instead, edit the trusted publisher and also
# allow npm publish, then change the last step to `npm publish`.
#
# Bump package.json, commit, tag vX.Y.Z, push the tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with staged publishing
        run: npm install -g npm@^11.15.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage
        run: npm stage publish
