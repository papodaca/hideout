# Publish live via GitHub OIDC. On npmjs.com the trusted publisher must
# allow `npm publish` (stage-only is not enough). Delete and recreate
# the publisher if the Edit form cannot add that permission.
#
# setup-node's registry-url writes an empty _authToken that makes npm
# skip OIDC. Strip it before publish.
#
# Bump package.json, commit, tag vX.Y.Z, push the tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Drop empty npm token so OIDC can run
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
