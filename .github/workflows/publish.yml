# Trusted publishing via OIDC. The npm publisher is stage-only, so CI
# uploads a draft and you approve it (2FA) on npmjs.com or:
#   npm stage approve @papodaca/hideout@<version>
#
# Do not set registry-url on setup-node. That writes an empty _authToken
# and npm then skips OIDC (E401).
#
# Bump package.json, commit, tag vX.Y.Z, push the tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use npm with staged publishing
        run: npm install -g npm@^11.15.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage
        run: |
          unset NODE_AUTH_TOKEN
          npm stage publish
