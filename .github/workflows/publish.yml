# Stage via GitHub OIDC. The trusted publisher is bound to the `npm`
# GitHub environment. That is an OIDC claim, not a secret. No NPM_TOKEN.
#
# After the job is green, approve with 2FA:
#   npm stage approve @papodaca/hideout@<version>
#
# Bump package.json, commit, tag vX.Y.Z, push the tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with staged publishing
        run: npm install -g npm@11.15.0

      - name: Drop empty npm token so OIDC can run
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage
        run: npm stage publish
