# Publish to npm via Trusted Publishing (OIDC). No NPM_TOKEN secret.
#
# One-time setup after the package exists on npm:
#   npm trust github hideout \
#     --file publish.yml \
#     --repository papodaca/hideout \
#     --allow-publish -y
# Or npmjs.com → @papodaca/hideout → Settings → Trusted Publisher
# → GitHub Actions (papodaca/hideout, publish.yml, allow npm publish).
#
# Then: bump package.json, commit, tag vX.Y.Z, push the tag.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
